<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get GPS Coordinates</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1e293b; 
            padding: 32px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
            border: 1px solid #334155; 
        }
        button { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 14px 24px; 
            border-radius: 8px; 
            font-size: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s; 
            width: 100%; 
            margin-top: 12px;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        .coords-box { 
            margin-top: 24px; 
            text-align: left; 
            background: #0f172a; 
            padding: 16px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
        }
        .coords-box p { 
            margin: 8px 0; 
            font-family: monospace; 
            font-size: 16px; 
            color: #10b981; 
        }
        .error { color: #ef4444; margin-top: 16px; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin-top: 0;">Branch GPS Locator</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">
            Click the button below and allow location access to get your exact coordinates for the RJ Mobile Admin Panel.
        </p>
        
        <button id="get-location-btn">📍 Get My Coordinates</button>
        
        <div id="output" style="display: none;">
            <div class="coords-box">
                <p><strong>Lat:</strong> <span id="lat">--</span></p>
                <p><strong>Lng:</strong> <span id="lng">--</span></p>
                <p style="font-size: 12px; color: #94a3b8; margin-top: 12px;">Accuracy: <span id="acc">--</span> meters</p>
            </div>
            <button id="copy-btn" style="background: #10b981; margin-top: 16px;">📋 Copy Coordinates</button>
        </div>
        
        <div id="error-msg" class="error"></div>
    </div>

    <script>
        document.getElementById('get-location-btn').addEventListener('click', () => {
            const errorMsg = document.getElementById('error-msg');
            const output = document.getElementById('output');
            const btn = document.getElementById('get-location-btn');
            
            errorMsg.innerText = '';
            btn.innerText = 'Fetching GPS...';

            if (!navigator.geolocation) {
                errorMsg.innerText = 'Geolocation is not supported by your browser.';
                btn.innerText = '📍 Get My Coordinates';
                return;
            }

            // Requesting high accuracy for geofencing
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    document.getElementById('lat').innerText = position.coords.latitude.toFixed(6);
                    document.getElementById('lng').innerText = position.coords.longitude.toFixed(6);
                    document.getElementById('acc').innerText = Math.round(position.coords.accuracy);
                    
                    output.style.display = 'block';
                    btn.innerText = '📍 Refresh Coordinates';
                },
                (error) => {
                    btn.innerText = '📍 Get My Coordinates';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg.innerText = "Permission denied. Please click the lock icon in the URL bar and allow location.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg.innerText = "Location information is unavailable right now.";
                            break;
                        case error.TIMEOUT:
                            errorMsg.innerText = "The request to get user location timed out.";
                            break;
                        default:
                            errorMsg.innerText = "An unknown error occurred.";
                            break;
                    }
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const lat = document.getElementById('lat').innerText;
            const lng = document.getElementById('lng').innerText;
            
            const textToCopy = `Latitude: ${lat}\nLongitude: ${lng}`;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.innerText = '✅ Copied to Clipboard!';
                copyBtn.style.background = '#059669'; // Darker green
                setTimeout(() => {
                    copyBtn.innerText = '📋 Copy Coordinates';
                    copyBtn.style.background = '#10b981'; // Reset
                }, 2000);
            });
        });
    </script>
</body>
</html>
